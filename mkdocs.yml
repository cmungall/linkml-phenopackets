site_name: "phenopackets in linkml"
theme:
  name: material
  analytics:
    gtag: G-2SYBSJVZ23
  palette:
  - media: '(prefers-color-scheme: light)'
    scheme: default
    primary: teal
    accent: amber
    toggle:
      icon: material/lightbulb
      name: Switch to light mode
  - media: '(prefers-color-scheme: dark)'
    scheme: slate
    primary: teal
    accent: amber
    toggle:
      icon: material/lightbulb-outline
      name: Switch to dark mode
  features:
    - content.tabs.link
plugins:
  - search
  - mermaid2:
      version: 9.3.0
  - mknotebooks:
      execute: false
markdown_extensions:
  # the pages that gen-doc generates have markdown inside <div markdown="1">
  - md_in_html
  # schema-diagram.md includes the diagram that `make gendocs` generates
  - pymdownx.snippets:
      base_path: docs
      check_paths: true
extra_css:
  - stylesheets/schema-diagram.css
extra_javascript:
  - https://unpkg.com/svg-pan-zoom@3.6.2/dist/svg-pan-zoom.min.js
  - javascripts/schema-diagram.js
nav:
  - Home: home.md
  - Index: index.md
  - Schema diagram: schema-diagram.md
  - Notebooks:
      - Validating: notebooks/LinkML-Validate.ipynb
      - Pydantic: notebooks/Pydantic.ipynb
      - Using OAK: notebooks/OAK.ipynb
      - RDF: notebooks/Generating-RDF.ipynb
site_url: https://cmungall.github.io/linkml-phenopackets/
repo_url: https://github.com/cmungall/linkml-phenopackets/
